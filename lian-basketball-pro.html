<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LIAN Basketball PRO V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06070a;font-family:Arial,"Segoe UI",sans-serif;color:#fff;touch-action:none}
button{font:inherit}
#app{width:min(100%,520px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#090c12,#050608)}
.screen{position:absolute;inset:0;display:none;padding:calc(14px + env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom));overflow:auto}
.screen.active{display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:1000;font-style:italic;letter-spacing:-1px;direction:ltr;font-size:22px}
.logo b{color:#ff2d8d}
.stats{display:flex;gap:8px}
.stat{padding:9px 11px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.06);font-size:12px;font-weight:900}
.hero{min-height:270px;border-radius:30px;padding:22px;position:relative;overflow:hidden;background:
radial-gradient(circle at 80% 18%,rgba(255,45,141,.34),transparent 24%),
radial-gradient(circle at 18% 8%,rgba(129,70,255,.25),transparent 30%),
linear-gradient(150deg,#17131d,#0c1119 55%,#080a0f);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.hero h1{margin:28px 0 0;direction:ltr;text-align:left;font-size:50px;line-height:.85;font-style:italic;letter-spacing:-3px}
.hero h1 span{display:block;color:#ff2d8d;font-size:58px}
.hero p{position:absolute;left:22px;bottom:18px;color:rgba(255,255,255,.62);font-size:11px;letter-spacing:1.5px}
.ballHero{position:absolute;right:26px;bottom:28px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffc47c,#ea8030 30%,#ca5216 62%,#6f2609);box-shadow:inset -18px -18px 30px rgba(0,0,0,.45),0 20px 30px rgba(0,0,0,.45)}
.ballHero:before,.ballHero:after{content:"";position:absolute;border-radius:50%}
.ballHero:before{inset:6px;border:3px solid #481709}
.ballHero:after{inset:0;border-left:4px solid #481709;border-right:4px solid #481709;transform:rotate(52deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;border-radius:22px;padding:16px;text-align:right;min-height:118px}
.card.primary{border-color:rgba(255,45,141,.55);background:linear-gradient(145deg,rgba(255,45,141,.18),rgba(255,255,255,.04))}
.card .ico{font-size:28px}.card b{display:block;margin-top:8px;font-size:17px}.card small{display:block;color:rgba(255,255,255,.58);margin-top:3px;font-size:11px;line-height:1.4}
.list{display:grid;gap:10px}
.mode{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:19px;background:rgba(255,255,255,.055);color:#fff;padding:13px;display:flex;gap:12px;align-items:center;text-align:right}
.mode .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,45,141,.18),rgba(120,65,255,.12));font-size:25px}
.mode b{display:block}.mode small{display:block;color:rgba(255,255,255,.58);font-size:11px;margin-top:3px}
.back{width:44px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff}
.pageTitle{font-size:24px;font-weight:1000}
.nav{position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:68px;border:1px solid rgba(255,255,255,.12);background:rgba(8,10,15,.9);backdrop-filter:blur(18px);border-radius:22px;display:grid;grid-template-columns:repeat(3,1fr);z-index:30}
.nav button{border:0;background:none;color:rgba(255,255,255,.5);font-size:11px;font-weight:900}
.nav button.active{color:#fff;background:linear-gradient(180deg,rgba(255,45,141,.14),rgba(120,65,255,.08))}
.game{padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));overflow:hidden}
.hud{height:54px;display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;align-items:center}
.hudBox{height:44px;border-radius:14px;background:rgba(13,16,22,.9);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.6);font-weight:900}
.hudBox b{color:#fff;font-size:17px;margin-right:5px}
.court{height:calc(100dvh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:520px;border-radius:26px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#070b12 0 36%,#8f552f 36% 100%)}
.arena{position:absolute;inset:0 0 auto 0;height:36%;background:
radial-gradient(circle at 15% 18%,rgba(255,255,255,.5) 0 1px,transparent 2px),
radial-gradient(circle at 30% 26%,rgba(255,255,255,.45) 0 1px,transparent 2px),
radial-gradient(circle at 48% 16%,rgba(255,255,255,.45) 0 1px,transparent 2px),
radial-gradient(circle at 67% 28%,rgba(255,255,255,.45) 0 1px,transparent 2px),
radial-gradient(circle at 85% 14%,rgba(255,255,255,.45) 0 1px,transparent 2px),
linear-gradient(180deg,#060910,#121824)}
.floor{position:absolute;left:0;right:0;top:36%;bottom:0;background:
linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.62) 49.8% 50.2%,transparent 50.5%),
repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 48px),
linear-gradient(180deg,#a56439,#794427)}
.floor:before{content:"";position:absolute;left:50%;top:12%;transform:translateX(-50%);width:60%;height:36%;border:3px solid rgba(255,255,255,.7);border-bottom:0}
.floor:after{content:"";position:absolute;left:50%;top:40%;transform:translateX(-50%);width:58%;height:58%;border:3px solid rgba(255,255,255,.68);border-radius:50%}
.hoop{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:180px;height:180px;z-index:10}
.board{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:76px;border:5px solid #eef4fb;background:rgba(255,255,255,.08)}
.board:after{content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:43px;height:28px;border:3px solid #fff}
.rim{position:absolute;top:75px;left:50%;transform:translateX(-50%);width:76px;height:16px;border:5px solid #ff5736;border-radius:50%}
.net{position:absolute;top:89px;left:50%;transform:translateX(-50%);width:56px;height:62px;clip-path:polygon(0 0,100% 0,73% 100%,27% 100%);background:repeating-linear-gradient(70deg,transparent 0 7px,rgba(255,255,255,.8) 8px 9px),repeating-linear-gradient(-70deg,transparent 0 7px,rgba(255,255,255,.8) 8px 9px)}
.ball{position:absolute;width:72px;height:72px;border-radius:50%;left:50%;bottom:56px;transform:translateX(-50%);z-index:20;background:radial-gradient(circle at 32% 26%,#ffc47b,#ed8433 28%,#cf5818 62%,#752708);box-shadow:inset -12px -14px 22px rgba(0,0,0,.45),0 16px 24px rgba(0,0,0,.35);touch-action:none}
.ball:before,.ball:after{content:"";position:absolute;border-radius:50%}.ball:before{inset:5px;border:2px solid #471708}.ball:after{inset:0;border-left:3px solid #471708;border-right:3px solid #471708;transform:rotate(52deg)}
.aim{position:absolute;height:4px;border-radius:99px;background:linear-gradient(90deg,#fff,#ff2d8d);transform-origin:left center;display:none;z-index:19;box-shadow:0 0 10px rgba(255,255,255,.5)}
.feedback{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.7);opacity:0;font-size:38px;font-weight:1000;font-style:italic;z-index:40;text-shadow:0 8px 22px #000;pointer-events:none}
.feedback.show{animation:pop .7s ease}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.tip{position:absolute;left:12px;right:12px;bottom:12px;z-index:25;padding:9px;border-radius:13px;background:rgba(8,10,14,.74);border:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.65);text-align:center}
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,3,5,.8);backdrop-filter:blur(12px);padding:20px}
.modal.show{display:flex}
.modalCard{width:100%;max-width:360px;border-radius:26px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,#171b24,#0b0d12);padding:24px;text-align:center}
.modalCard h2{margin:8px 0}.big{font-size:58px;color:#ff2d8d;font-weight:1000;margin:10px 0}.note{color:rgba(255,255,255,.62);font-size:12px}
.cta{width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;color:#fff;font-weight:1000;background:linear-gradient(90deg,#ff2d8d,#7b40ff)}
.cta.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="app">

<section id="home" class="screen active">
  <div class="top">
    <div class="stats">
      <div class="stat">🪙 <span id="coins">0</span></div>
      <div class="stat">⭐ <span id="level">1</span></div>
    </div>
    <div class="logo">LIAN <b>BASKETBALL</b> PRO</div>
  </div>

  <div class="hero">
    <h1>LIAN<br>BASKETBALL<span>PRO</span></h1>
    <p>PLAY • SCORE • LEVEL UP</p>
    <div class="ballHero"></div>
  </div>

  <div class="grid">
    <button class="card primary" onclick="show('play')"><div class="ico">🏀</div><b>PLAY</b><small>Free Throw · 3PT · Beat The Clock</small></button>
    <button class="card" onclick="show('career')"><div class="ico">🏆</div><b>CAREER</b><small>פותחים אולמות ככל שעולים רמות</small></button>
    <button class="card" onclick="show('missions')"><div class="ico">🎯</div><b>MISSIONS</b><small>משימת היום: 10 סלים</small></button>
    <button class="card" onclick="location.href='index.html'"><div class="ico">⌂</div><b>LIAN HUB</b><small>חזרה לאתר הראשי</small></button>
  </div>
</section>

<section id="play" class="screen">
  <div class="top"><button class="back" onclick="show('home')">←</button><div class="pageTitle">PLAY</div><div style="width:44px"></div></div>
  <div class="list">
    <button class="mode" onclick="startGame('free')"><div class="ico">🎯</div><div><b>Free Throw</b><small>10 זריקות · נקודה לכל סל</small></div></button>
    <button class="mode" onclick="startGame('three')"><div class="ico">3️⃣</div><div><b>3 Point Contest</b><small>15 זריקות · 3 נקודות לכל סל · העמדה משתנה</small></div></button>
    <button class="mode" onclick="startGame('clock')"><div class="ico">⏱️</div><div><b>Beat The Clock</b><small>45 שניות · כמה נקודות תצליחי?</small></div></button>
  </div>
</section>

<section id="career" class="screen">
  <div class="top"><button class="back" onclick="show('home')">←</button><div class="pageTitle">CAREER</div><div style="width:44px"></div></div>
  <div id="careerList" class="list"></div>
</section>

<section id="missions" class="screen">
  <div class="top"><button class="back" onclick="show('home')">←</button><div class="pageTitle">MISSIONS</div><div style="width:44px"></div></div>
  <div class="mode"><div class="ico">🎯</div><div><b>קלעי 10 סלים היום</b><small id="missionText">0 / 10</small></div></div>
  <div class="mode" style="margin-top:10px"><div class="ico">🎁</div><div><b>פרס</b><small>100 מטבעות אחרי 10 סלים</small></div></div>
</section>

<section id="game" class="screen game">
  <div class="hud">
    <button class="back" onclick="endEarly()">✕</button>
    <div class="hudBox">SCORE <b id="score">0</b></div>
    <div class="hudBox">ROUND <b id="counter">0/10</b></div>
  </div>

  <div id="court" class="court">
    <div class="arena"></div>
    <div class="floor"></div>
    <div class="hoop"><div class="board"></div><div class="rim"></div><div class="net"></div></div>
    <div id="aim" class="aim"></div>
    <div id="ball" class="ball"></div>
    <div id="feedback" class="feedback">SWISH!</div>
    <div class="tip">געי בכדור, גררי כלפי מעלה ושחררי. הכיוון והעוצמה משפיעים על הזריקה.</div>
  </div>
</section>

<div id="nav" class="nav">
  <button data-go="home" class="active">HOME</button>
  <button data-go="missions">MISSIONS</button>
  <button data-go="career">CAREER</button>
</div>

<div id="result" class="modal">
  <div class="modalCard">
    <div style="font-size:44px">🏀</div>
    <h2>GAME COMPLETE</h2>
    <div class="big" id="finalScore">0</div>
    <div class="note" id="rewardText"></div>
    <button class="cta" onclick="restart()">שחקי שוב</button>
    <button class="cta ghost" onclick="closeResult()">חזרה</button>
  </div>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const todayKey = new Date().toISOString().slice(0,10);
let state = JSON.parse(localStorage.getItem("lianBasketballV3") || "null") || {
  xp:0, coins:0, totalMakes:0, dailyDate:todayKey, dailyMakes:0, dailyClaimed:false
};
if(state.dailyDate !== todayKey){
  state.dailyDate = todayKey;
  state.dailyMakes = 0;
  state.dailyClaimed = false;
}

function save(){
  localStorage.setItem("lianBasketballV3", JSON.stringify(state));
  updateUI();
}
function level(){ return Math.floor(state.xp/400)+1; }

function updateUI(){
  $("#coins").textContent = state.coins;
  $("#level").textContent = level();
  $("#missionText").textContent = Math.min(state.dailyMakes,10) + " / 10";
  const rows = [
    ["🏡","Backyard Court",1],
    ["🌃","Street Court",2],
    ["🏫","School Arena",3],
    ["🏟️","Pro Arena",5],
    ["⭐","All-Star Arena",8]
  ];
  $("#careerList").innerHTML = rows.map(([ico,name,lv]) => `
    <div class="mode" style="${level()<lv?'opacity:.4':''}">
      <div class="ico">${ico}</div>
      <div><b>${name}</b><small>${level()>=lv?'פתוח':'ייפתח ברמה '+lv}</small></div>
    </div>`).join("");
}
save();

function show(id){
  $$(".screen").forEach(s=>s.classList.remove("active"));
  $("#"+id).classList.add("active");
  $("#nav").style.display = id==="game" ? "none" : "grid";
  $$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.go===id));
}
$$("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.go));

let game = {mode:"free",score:0,attempts:0,max:10,time:0,timer:null,active:false,lastMode:"free"};
function startGame(mode){
  clearInterval(game.timer);
  game = {mode,lastMode:mode,score:0,attempts:0,max:mode==="three"?15:10,time:mode==="clock"?45:0,timer:null,active:true};
  if(mode==="clock") game.max=999;
  show("game");
  placeBall();
  updateHud();
  if(mode==="clock"){
    game.timer=setInterval(()=>{
      game.time--;
      updateHud();
      if(game.time<=0) finishGame();
    },1000);
  }
}
function updateHud(){
  $("#score").textContent=game.score;
  $("#counter").textContent=game.mode==="clock" ? game.time+"s" : game.attempts+"/"+game.max;
}

const ball=$("#ball"), court=$("#court"), aim=$("#aim");
let drag=null, anim=null;

function startPos(){
  const rect=court.getBoundingClientRect();
  if(game.mode==="three"){
    const positions=[0.20,0.35,0.50,0.65,0.80];
    return {x:rect.width*positions[game.attempts%positions.length]-36,y:rect.height-132};
  }
  return {x:rect.width/2-36,y:rect.height-132};
}
function placeBall(){
  const p=startPos();
  ball.style.left=p.x+"px";
  ball.style.top=p.y+"px";
  ball.style.bottom="auto";
  ball.style.transform="none";
}

ball.addEventListener("pointerdown",e=>{
  if(!game.active)return;
  e.preventDefault();
  ball.setPointerCapture?.(e.pointerId);
  drag={sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY};
  aim.style.display="block";
  drawAim();
});
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  drag.cx=e.clientX;drag.cy=e.clientY;drawAim();
},{passive:false});
window.addEventListener("pointerup",()=>{
  if(!drag)return;
  const dx=drag.cx-drag.sx, dy=drag.cy-drag.sy;
  drag=null;aim.style.display="none";
  if(dy>-35)return;
  shoot(dx,dy);
},{passive:false});

function drawAim(){
  const cr=court.getBoundingClientRect(), br=ball.getBoundingClientRect();
  const sx=br.left+36-cr.left, sy=br.top+36-cr.top;
  const dx=-(drag.cx-drag.sx), dy=-(drag.cy-drag.sy);
  const len=Math.min(170,Math.hypot(dx,dy));
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  aim.style.left=sx+"px"; aim.style.top=sy+"px"; aim.style.width=len+"px"; aim.style.transform=`rotate(${ang}deg)`;
}

function shoot(dx,dy){
  game.active=false;
  game.attempts++;
  updateHud();

  const cr=court.getBoundingClientRect(), br=ball.getBoundingClientRect();
  let x=br.left-cr.left, y=br.top-cr.top;
  const targetX=cr.width/2;
  const targetY=cr.height*0.13+84;

  const power=Math.min(1.35,Math.max(.72,Math.abs(dy)/145));
  let vx=(targetX-(x+36))*.018 - dx*.0105;
  let vy=-9.3*power;
  let frames=0, made=false;

  cancelAnimationFrame(anim);
  function step(){
    frames++;
    x+=vx; y+=vy; vy+=.31;
    ball.style.left=x+"px";ball.style.top=y+"px";ball.style.transform=`rotate(${frames*13}deg)`;

    const cx=x+36, cy=y+36;
    if(!made && vy>0 && Math.abs(cx-targetX)<34 && cy>targetY-12 && cy<targetY+20){
      made=true; onMake(); return;
    }
    if(y>cr.height+80 || x<-90 || x>cr.width+90 || frames>190){
      onMiss(); return;
    }
    anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}

function pop(text,color="#fff"){
  const f=$("#feedback");
  f.textContent=text;f.style.color=color;f.classList.remove("show");void f.offsetWidth;f.classList.add("show");
}

function onMake(){
  const points=game.mode==="three"?3:1;
  game.score+=points;
  state.totalMakes++;
  state.dailyMakes++;
  state.xp+=game.mode==="three"?20:12;
  state.coins+=game.mode==="three"?8:5;

  if(state.dailyMakes>=10 && !state.dailyClaimed){
    state.dailyClaimed=true;
    state.coins+=100;
    pop("🎁 +100");
  }else pop(game.mode==="three"?"+3":"SWISH!");

  save();
  afterShot();
}
function onMiss(){ pop("MISS","#ff6572"); afterShot(); }

function afterShot(){
  setTimeout(()=>{
    if(game.mode!=="clock" && game.attempts>=game.max) finishGame();
    else { game.active=true; placeBall(); updateHud(); }
  },650);
}
function finishGame(){
  clearInterval(game.timer);
  if(!$("#game").classList.contains("active"))return;
  game.active=false;
  const bonusXP=Math.max(10,game.score*2);
  const bonusCoins=Math.max(5,Math.floor(game.score/2));
  state.xp+=bonusXP; state.coins+=bonusCoins; save();
  $("#finalScore").textContent=game.score;
  $("#rewardText").textContent=`בונוס סיום: ${bonusXP} XP ו-${bonusCoins} מטבעות`;
  $("#result").classList.add("show");
}
function restart(){ $("#result").classList.remove("show"); startGame(game.lastMode); }
function closeResult(){ $("#result").classList.remove("show"); show("play"); }
function endEarly(){ clearInterval(game.timer); game.active=false; show("play"); }

document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
