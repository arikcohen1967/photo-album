<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>LIAN Basketball PRO</title>
<style>
:root{--pink:#ff2f9a;--purple:#8a35ff;--gold:#ffd34e;--muted:rgba(255,255,255,.64)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050a;color:#fff;font-family:Arial,"Segoe UI",sans-serif;touch-action:none}
button{font:inherit;color:inherit}
#app{position:relative;width:min(100%,540px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#090a13,#05050a)}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{padding:calc(12px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom));overflow:auto}
.top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{direction:ltr;font-size:20px;font-weight:1000;font-style:italic;line-height:.95}.brand b{color:var(--pink)}.brand small{display:block;margin-top:5px;font-size:8px;letter-spacing:2px;color:var(--muted);font-style:normal}
.stats{display:flex;gap:6px}.pill{height:35px;padding:0 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900}.pill strong{color:var(--gold)}
.hero{height:330px;border-radius:29px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.13);background:
radial-gradient(circle at 50% 17%,rgba(255,255,255,.16),transparent 7%),
radial-gradient(circle at 17% 25%,rgba(255,47,154,.20),transparent 22%),
radial-gradient(circle at 83% 25%,rgba(138,53,255,.22),transparent 22%),
linear-gradient(180deg,#0b0d1a 0 52%,#8e5432 52% 100%);box-shadow:0 28px 70px rgba(0,0,0,.48)}
.hero:before{content:"";position:absolute;left:50%;top:50%;transform:translateX(-50%);width:122px;height:76px;border:4px solid rgba(255,255,255,.9);background:rgba(210,230,255,.08)}
.hero:after{content:"";position:absolute;left:50%;top:72%;transform:translateX(-50%);width:64%;height:40%;border:2px solid rgba(255,255,255,.45);border-radius:50%}
.heroText{position:absolute;z-index:2;left:18px;bottom:18px;direction:ltr;text-align:left}.heroText h1{margin:0;font-size:43px;line-height:.86;letter-spacing:-2.5px;font-style:italic;text-shadow:0 7px 20px #000}.heroText h1 span{display:block;color:var(--pink);font-size:51px}.heroText p{font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:900}
.play{width:100%;border:0;border-radius:19px;padding:16px;margin-top:11px;background:linear-gradient(90deg,var(--pink),var(--purple));font-size:18px;font-weight:1000;box-shadow:0 15px 35px rgba(190,40,255,.24)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.card{min-height:105px;border-radius:20px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);padding:14px;text-align:right}.card i{font-style:normal;font-size:26px}.card b{display:block;margin-top:7px;font-size:14px}.card small{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
.bottom{position:absolute;z-index:30;left:9px;right:9px;bottom:calc(8px + env(safe-area-inset-bottom));height:67px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(7,8,15,.91);display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}.bottom button{border:0;background:none;color:rgba(255,255,255,.5);font-size:10px;font-weight:900}.bottom button.active{color:#fff;background:rgba(255,47,154,.11)}
.page{padding:calc(13px + env(safe-area-inset-top)) 12px calc(85px + env(safe-area-inset-bottom));overflow:auto}.head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}.head h2{margin:0;text-align:center}.back{width:42px;height:40px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.06)}
.mode{width:100%;margin-bottom:9px;padding:13px;border-radius:19px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);display:flex;align-items:center;gap:12px;text-align:right}.mi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,47,154,.18),rgba(138,53,255,.13));font-size:24px}.mode b{display:block}.mode small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
#game{background:#05050a}.gamehud{position:absolute;z-index:20;left:8px;right:8px;top:calc(7px + env(safe-area-inset-top));height:45px;display:grid;grid-template-columns:44px 1fr 1fr;gap:7px}.hud{border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(5,6,12,.82);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-weight:900}.hud b{font-size:17px;color:#fff;margin-right:5px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tip{position:absolute;z-index:20;left:50%;bottom:calc(15px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(5,6,12,.78);font-size:10px;font-weight:900;color:rgba(255,255,255,.78)}
.msg{position:absolute;z-index:25;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:38px;font-weight:1000;font-style:italic;text-shadow:0 7px 20px #000}.msg.show{animation:pop .75s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,2,6,.82)}.modal.show{display:flex}.modalbox{width:100%;max-width:350px;border:1px solid rgba(255,255,255,.13);border-radius:26px;background:linear-gradient(160deg,#171925,#090a10);padding:23px;text-align:center}.big{font-size:58px;color:var(--pink);font-weight:1000}.cta{width:100%;border:0;border-radius:15px;padding:14px;margin-top:9px;background:linear-gradient(90deg,var(--pink),var(--purple));font-weight:1000}.cta.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="app">
<section id="home" class="screen active">
 <div class="top">
  <div class="stats"><div class="pill">🪙 <strong id="coins">0</strong></div><div class="pill">⭐ <strong id="lvl">1</strong></div></div>
  <div class="brand">LIAN <b>BASKETBALL</b> PRO<small>LIAN STARS • #23</small></div>
 </div>
 <div class="hero"><div class="heroText"><h1>LIAN<br>BASKETBALL<span>PRO</span></h1><p>DREAM • SHOOT • WIN</p></div></div>
 <button class="play" onclick="show('playPage')">🏀 PLAY NOW</button>
 <div class="grid">
  <button class="card" onclick="show('career')"><i>🏆</i><b>CAREER</b><small>פתחי אולמות ורמות</small></button>
  <button class="card" onclick="show('statsPage')"><i>📊</i><b>MY STATS</b><small>אחוזים, סלים ושיא</small></button>
  <button class="card" onclick="show('missions')"><i>🎯</i><b>MISSIONS</b><small>10 סלים ביום = פרס</small></button>
  <button class="card" onclick="location.href='index.html'"><i>⌂</i><b>LIAN HUB</b><small>חזרה לאתר הראשי</small></button>
 </div>
</section>

<section id="playPage" class="screen page">
 <div class="head"><button class="back" onclick="show('home')">←</button><h2>PLAY</h2><div></div></div>
 <button class="mode" onclick="start('quick')"><span class="mi">🏀</span><span><b>Quick Shot</b><small>10 זריקות · קליעה רגילה</small></span></button>
 <button class="mode" onclick="start('three')"><span class="mi">3️⃣</span><span><b>3 Point Contest</b><small>15 זריקות מ־5 עמדות</small></span></button>
 <button class="mode" onclick="start('clock')"><span class="mi">⏱️</span><span><b>Beat The Clock</b><small>45 שניות · כמה שיותר סלים</small></span></button>
</section>

<section id="career" class="screen page"><div class="head"><button class="back" onclick="show('home')">←</button><h2>CAREER</h2><div></div></div><div id="careerList"></div></section>
<section id="missions" class="screen page"><div class="head"><button class="back" onclick="show('home')">←</button><h2>MISSIONS</h2><div></div></div><div class="mode"><span class="mi">🎯</span><span><b>קלעי 10 סלים היום</b><small id="daily">0 / 10</small></span></div></section>
<section id="statsPage" class="screen page"><div class="head"><button class="back" onclick="show('home')">←</button><h2>MY STATS</h2><div></div></div><div id="statsList"></div></section>

<section id="game" class="screen">
 <canvas id="c"></canvas>
 <div class="gamehud"><button class="back" onclick="quit()">✕</button><div class="hud">SCORE <b id="score">0</b></div><div class="hud">ROUND <b id="round">0/10</b></div></div>
 <div id="msg" class="msg">SWISH!</div>
 <div class="tip">גררי את הכדור כלפי מעלה אל הסל ושחררי</div>
</section>

<div id="nav" class="bottom">
 <button data-id="home" class="active">⌂<br>HOME</button>
 <button data-id="missions">🎯<br>MISSIONS</button>
 <button data-id="statsPage">📊<br>STATS</button>
</div>

<div id="result" class="modal"><div class="modalbox"><div style="font-size:44px">🏀</div><h2>GAME COMPLETE</h2><div class="big" id="final">0</div><div id="reward" style="color:var(--muted);font-size:12px"></div><button class="cta" onclick="again()">שחקי שוב</button><button class="cta ghost" onclick="closeResult()">חזרה</button></div></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const dateKey=()=>new Date().toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem("lianBasketballV6")||"null")||{coins:0,xp:0,makes:0,shots:0,best:0,day:dateKey(),daily:0,claimed:false};
if(data.day!==dateKey()){data.day=dateKey();data.daily=0;data.claimed=false}
const level=()=>Math.floor(data.xp/300)+1;
function save(){localStorage.setItem("lianBasketballV6",JSON.stringify(data));ui()}
function ui(){
 $("#coins").textContent=data.coins;$("#lvl").textContent=level();$("#daily").textContent=Math.min(10,data.daily)+" / 10";
 const pct=data.shots?Math.round(data.makes/data.shots*100):0;
 $("#statsList").innerHTML=`<div class="mode"><span class="mi">🏀</span><span><b>${data.makes} סלים</b><small>${data.shots} זריקות</small></span></div><div class="mode"><span class="mi">🎯</span><span><b>${pct}% קליעה</b><small>אחוז כולל</small></span></div><div class="mode"><span class="mi">👑</span><span><b>${data.best} שיא</b><small>Best Score</small></span></div>`;
 const arr=[["🏡","Backyard Court",1],["🌃","Street Court",2],["🏟️","Pro Arena",4],["⭐","All-Star Arena",7]];
 $("#careerList").innerHTML=arr.map(x=>`<div class="mode" style="opacity:${level()>=x[2]?1:.4}"><span class="mi">${x[0]}</span><span><b>${x[1]}</b><small>${level()>=x[2]?"פתוח":"ייפתח ברמה "+x[2]}</small></span></div>`).join("")
}
save();
function show(id){$$(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active");$("#nav").style.display=id==="game"?"none":"grid";$$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));if(id==="game")setTimeout(resize,0)}
$$("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.id));

const c=$("#c"),ctx=c.getContext("2d");let W=0,H=0,dpr=1;
let game={mode:"quick",last:"quick",score:0,n:0,max:10,time:0,timer:null,ready:false};
let ball={x:0,y:0,r:31},drag=null,flight=null,confetti=[];
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}
addEventListener("resize",()=>{$("#game").classList.contains("active")&&resize()});
function hoop(){return{x:W/2,y:H*.285,rimY:H*.335}}
function positions(){return game.mode==="three"?[.18,.34,.5,.66,.82]:[.5]}
function reset(){ball.x=W*positions()[game.n%positions().length];ball.y=H*.79;ball.r=Math.max(27,Math.min(33,W*.065));drag=null;flight=null;game.ready=true}
function start(mode){
 clearInterval(game.timer);game={mode,last:mode,score:0,n:0,max:mode==="three"?15:10,time:mode==="clock"?45:0,timer:null,ready:true};if(mode==="clock")game.max=999;show("game");reset();hud();
 if(mode==="clock")game.timer=setInterval(()=>{game.time--;hud();if(game.time<=0)finish()},1000)
}
function hud(){$("#score").textContent=game.score;$("#round").textContent=game.mode==="clock"?game.time+"s":game.n+"/"+game.max}
function quit(){clearInterval(game.timer);game.ready=false;show("playPage")}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener("pointerdown",e=>{if(!game.ready||flight)return;let p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<ball.r*1.8){drag={start:p,now:p};c.setPointerCapture?.(e.pointerId)}});
c.addEventListener("pointermove",e=>{if(drag)drag.now=pos(e)});
c.addEventListener("pointerup",()=>{if(!drag)return;let dx=drag.now.x-drag.start.x,dy=drag.now.y-drag.start.y,dist=Math.hypot(dx,dy);if(dist<28){drag=null;return}shoot(dx,dy,dist);drag=null});

function shotPlan(dx,dy,p){
 const h=hoop();
 // Upward swipe is intuitive: horizontal direction steers the shot, vertical distance sets power.
 let targetX=h.x+dx*.30;
 let ideal=128;
 let powerError=p-ideal;
 let targetY=h.rimY+powerError*.38;
 let goodDirection=dy<-35;
 let make=goodDirection && Math.abs(targetX-h.x)<48 && Math.abs(powerError)<46;
 if(make){targetX=h.x;targetY=h.rimY}
 return{targetX,targetY,make}
}
function path(sx,sy,tx,ty,make){
 let apexY=Math.min(ty-155,sy-250);
 return{sx,sy,cx:(sx+tx)/2,cy:apexY,tx,ty,make,endY:ty+145}
}
function bez(q,t){
 if(t<.76){let u=t/.76,m=1-u;return{x:m*m*q.sx+2*m*u*q.cx+u*u*q.tx,y:m*m*q.sy+2*m*u*q.cy+u*u*q.ty}}
 let u=(t-.76)/.24;
 // On a made shot the ball visibly falls through the center of the rim and net.
 return{x:q.tx,y:q.ty+(q.endY-q.ty)*u}
}
function shoot(dx,dy,p){
 game.ready=false;game.n++;data.shots++;hud();
 let s=shotPlan(dx,dy,p),tx=s.targetX,ty=s.targetY;
 if(!s.make && Math.abs(tx-hoop().x)<35)tx+=dx<0?-65:65;
 flight=path(ball.x,ball.y,tx,ty,s.make);flight.start=performance.now();flight.duration=920;flight.make=s.make
}
function done(make){
 flight=null;
 if(make){
  let pts=game.mode==="three"?3:1;game.score+=pts;data.makes++;data.daily++;data.coins+=game.mode==="three"?8:5;data.xp+=12;
  burst();message(game.mode==="three"?"+3 SWISH!":"SWISH!","#fff");
  if(data.daily>=10&&!data.claimed){data.claimed=true;data.coins+=100;setTimeout(()=>message("🎁 +100","#ffd34e"),250)}
 }else message("MISS","#ff6678");
 save();hud();
 setTimeout(()=>{if(game.mode!=="clock"&&game.n>=game.max)finish();else reset()},620)
}
function finish(){
 clearInterval(game.timer);if(!$("#game").classList.contains("active"))return;game.ready=false;flight=null;data.best=Math.max(data.best,game.score);let bonus=Math.max(5,Math.floor(game.score/2));data.coins+=bonus;data.xp+=Math.max(10,game.score*2);save();$("#final").textContent=game.score;$("#reward").textContent=`בונוס: ${bonus} מטבעות`;$("#result").classList.add("show")
}
function again(){$("#result").classList.remove("show");start(game.last)}
function closeResult(){$("#result").classList.remove("show");show("playPage")}
function message(t,col){let m=$("#msg");m.textContent=t;m.style.color=col;m.classList.remove("show");void m.offsetWidth;m.classList.add("show")}
function burst(){let h=hoop();for(let i=0;i<24;i++)confetti.push({x:h.x,y:h.rimY+35,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,l:1})}

function arena(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#070916");g.addColorStop(.35,"#15172a");g.addColorStop(.355,"#aa6a40");g.addColorStop(1,"#6d3c24");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#070810";ctx.fillRect(0,H*.12,W,H*.22);
 for(let y=H*.14;y<H*.32;y+=11)for(let x=5;x<W;x+=11){ctx.fillStyle=`rgba(${130+(x+y)%90},${45+(x*2)%90},${140+(y*2)%100},.34)`;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle="rgba(255,255,255,.65)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H*.36);ctx.lineTo(W/2,H);ctx.stroke();ctx.beginPath();ctx.ellipse(W/2,H*.72,W*.3,H*.21,0,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#ff54ac";ctx.font="900 11px Arial";ctx.textAlign="center";ctx.fillText("LIAN STARS",W*.17,H*.335);ctx.fillText("GO LIAN!",W*.83,H*.335)
}
function basket(){
 let h=hoop();
 ctx.fillStyle="#24263a";ctx.fillRect(h.x-6,h.y+72,12,H*.18);
 ctx.fillStyle="rgba(210,230,255,.11)";ctx.strokeStyle="#f5f8ff";ctx.lineWidth=4;ctx.fillRect(h.x-66,h.y,132,76);ctx.strokeRect(h.x-66,h.y,132,76);ctx.strokeRect(h.x-22,h.y+41,44,27);
 ctx.strokeStyle="#ff5b35";ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(h.x,h.rimY,39,8,0,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1.3;for(let i=-30;i<=30;i+=10){ctx.beginPath();ctx.moveTo(h.x+i,h.rimY+5);ctx.lineTo(h.x+i*.5,h.rimY+66);ctx.stroke()}for(let yy=18;yy<60;yy+=12){ctx.beginPath();ctx.ellipse(h.x,h.rimY+yy,31-yy*.25,4,0,0,Math.PI*2);ctx.stroke()}
}
function drawBall(x,y,r,rot=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);let g=ctx.createRadialGradient(-r*.3,-r*.3,2,0,0,r);g.addColorStop(0,"#ffc184");g.addColorStop(.38,"#f18432");g.addColorStop(.75,"#c94d15");g.addColorStop(1,"#6d2207");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#381107";ctx.lineWidth=2.7;ctx.beginPath();ctx.arc(0,0,r*.91,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,r*.3,r*.9,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,r*.83,r*.23,0,0,Math.PI*2);ctx.stroke();ctx.restore()
}
function hands(){
 if(flight)return;
 let x=ball.x,y=ball.y,r=ball.r;
 ctx.save();
 // forearms
 ctx.strokeStyle="#c98362";ctx.lineWidth=r*.7;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x-r*1.55,y+r*2.9);ctx.lineTo(x-r*.75,y+r*.45);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+r*1.55,y+r*2.9);ctx.lineTo(x+r*.75,y+r*.45);ctx.stroke();
 // palms/fingers around the ball
 ctx.strokeStyle="#e0a07d";ctx.lineWidth=r*.22;
 for(let i=0;i<4;i++){
  ctx.beginPath();ctx.moveTo(x-r*.85-i*1.2,y+r*.45+i*2);ctx.lineTo(x-r*.58+i*2,y-r*.42+i*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+r*.85+i*1.2,y+r*.45+i*2);ctx.lineTo(x+r*.58-i*2,y-r*.42+i*2);ctx.stroke();
 }
 // wrist bands
 ctx.strokeStyle="#ff3a9f";ctx.lineWidth=r*.34;
 ctx.beginPath();ctx.moveTo(x-r*1.38,y+r*2.25);ctx.lineTo(x-r*1.15,y+r*1.58);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+r*1.38,y+r*2.25);ctx.lineTo(x+r*1.15,y+r*1.58);ctx.stroke();
 ctx.restore()
}
function guide(){
 if(!drag)return;let dx=drag.now.x-drag.start.x,dy=drag.now.y-drag.start.y,p=Math.hypot(dx,dy);if(p<5)return;let s=shotPlan(dx,dy,p),q=path(ball.x,ball.y,s.targetX,s.targetY,s.make);
 ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle=s.make?"#62ff9a":"rgba(255,255,255,.7)";ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=26;i++){let z=bez(q,(i/26)*.76);i?ctx.lineTo(z.x,z.y):ctx.moveTo(z.x,z.y)}ctx.stroke();ctx.restore()
}
function particles(){for(let p of confetti){p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.l-=.025;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=Math.random()>.5?"#ff3b9d":"#ffd34e";ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;confetti=confetti.filter(p=>p.l>0)}
